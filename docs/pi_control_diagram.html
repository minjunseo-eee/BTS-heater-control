<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PI 제어 블록다이어그램</title>
<style>
  :root {
    --surface: #ffffff;
    --ink-primary: #1a202c;
    --ink-secondary: #4a5568;
    --ink-muted: #718096;
    --line: #a0aec0;
    --box-neutral-bg: #f7fafc;
    --box-neutral-border: #cbd5e0;
    --accent-controller: #2b6cb0;
    --accent-controller-bg: #ebf4ff;
    --accent-plant: #c05621;
    --accent-plant-bg: #fffaf0;
    --accent-sensor: #2f855a;
    --accent-sensor-bg: #f0fff4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px;
    background: var(--surface);
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink-primary);
  }
  .wrap { max-width: 1120px; margin: 0 auto; }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px 0;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: var(--ink-muted);
    font-size: 13px;
    margin: 0 0 32px 0;
  }
  svg { display: block; width: 100%; height: auto; }
  .box-label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--ink-primary);
  }
  .box-sub {
    font-size: 11.5px;
    fill: var(--ink-secondary);
  }
  .flow-label {
    font-size: 11.5px;
    fill: var(--ink-muted);
  }
  .section-tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--ink-secondary);
  }
  .swatch {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>발열체 온도 제어 — PI 폐루프(Closed-Loop) 구조</h1>
  <p class="subtitle">목표온도(85°C)를 유지하기 위한 피드백 제어 블록다이어그램 · Phase1(급속승온) → Phase2(PI 정밀제어) 하이브리드 구조</p>

  <svg viewBox="0 0 1120 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#718096" />
      </marker>
      <marker id="arrowFeedback" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#2f855a" />
      </marker>
    </defs>

    <!-- ===== Phase 1 dashed region ===== -->
    <rect x="20" y="40" width="230" height="200" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="135" y="64" text-anchor="middle" class="section-tag" fill="#a0aec0">PHASE 1 · 급속승온</text>
    <rect x="55" y="90" width="160" height="90" rx="10" fill="var(--box-neutral-bg)" stroke="var(--box-neutral-border)" stroke-width="1.5"/>
    <text x="135" y="128" text-anchor="middle" class="box-label">고정 전압</text>
    <text x="135" y="148" text-anchor="middle" class="box-sub">24V (안전 상한)</text>
    <text x="135" y="200" text-anchor="middle" class="flow-label">목표 대비 온도가 낮을 때만 동작</text>

    <!-- Phase1 -> switch arrow -->
    <line x1="250" y1="135" x2="300" y2="135" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="275" y="120" text-anchor="middle" class="flow-label">80°C 도달</text>

    <!-- ===== Switch node ===== -->
    <polygon points="300,135 340,105 380,135 340,165" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.5"/>
    <text x="340" y="139" text-anchor="middle" font-size="11" fill="var(--ink-secondary)">전환</text>

    <!-- switch -> setpoint sum arrow -->
    <line x1="380" y1="135" x2="430" y2="135" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- ===== PHASE 2: PI loop ===== -->
    <text x="700" y="64" text-anchor="middle" class="section-tag" fill="#2b6cb0">PHASE 2 · PI 정밀제어 (폐루프)</text>

    <!-- Setpoint -->
    <rect x="430" y="100" width="120" height="70" rx="10" fill="var(--box-neutral-bg)" stroke="var(--box-neutral-border)" stroke-width="1.5"/>
    <text x="490" y="130" text-anchor="middle" class="box-label">목표온도</text>
    <text x="490" y="150" text-anchor="middle" class="box-sub">Setpoint 85°C</text>

    <!-- Sum junction -->
    <circle cx="600" cy="135" r="22" fill="#fff" stroke="#a0aec0" stroke-width="1.5"/>
    <text x="600" y="128" text-anchor="middle" font-size="16" fill="var(--ink-secondary)">Σ</text>
    <text x="600" y="145" text-anchor="middle" font-size="10" fill="var(--ink-muted)">e = 목표-현재</text>
    <line x1="550" y1="135" x2="578" y2="135" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Sum -> PI controller -->
    <line x1="622" y1="135" x2="675" y2="135" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="648" y="120" text-anchor="middle" class="flow-label">오차 e</text>

    <!-- PI controller box -->
    <rect x="675" y="85" width="180" height="100" rx="10" fill="var(--accent-controller-bg)" stroke="var(--accent-controller)" stroke-width="1.8"/>
    <text x="765" y="118" text-anchor="middle" class="box-label" fill="var(--accent-controller)">PI 제어기</text>
    <text x="765" y="140" text-anchor="middle" class="box-sub">Kp·e(t) + Ki·∫e(t)dt</text>
    <text x="765" y="160" text-anchor="middle" class="box-sub" fill="var(--ink-muted)">0.1V 단위 미세조정</text>

    <!-- PI -> plant -->
    <line x1="855" y1="135" x2="910" y2="135" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="883" y="120" text-anchor="middle" class="flow-label">전압</text>

    <!-- Power supply + heater (plant) -->
    <rect x="910" y="80" width="180" height="180" rx="10" fill="var(--accent-plant-bg)" stroke="var(--accent-plant)" stroke-width="1.8"/>
    <text x="1000" y="112" text-anchor="middle" class="box-label" fill="var(--accent-plant)">Plant (제어 대상)</text>
    <line x1="930" y1="128" x2="1070" y2="128" stroke="#fed7aa" stroke-width="1"/>
    <text x="1000" y="150" text-anchor="middle" class="box-sub">Chroma 62000P</text>
    <text x="1000" y="168" text-anchor="middle" class="box-sub" fill="var(--ink-muted)">DC Power Supply (SCPI)</text>
    <text x="1000" y="200" text-anchor="middle" class="box-sub">나노카본 발열체</text>
    <text x="1000" y="218" text-anchor="middle" class="box-sub" fill="var(--ink-muted)">(온도에 따라 저항 변화)</text>
    <text x="1000" y="245" text-anchor="middle" class="flow-label">↳ 열 관성(지연) 존재</text>

    <!-- Feedback line: plant -> sensor -->
    <line x1="1000" y1="260" x2="1000" y2="330" stroke="#68d391" stroke-width="1.5" marker-end="url(#arrowFeedback)"/>

    <!-- Sensor box -->
    <rect x="910" y="330" width="180" height="80" rx="10" fill="var(--accent-sensor-bg)" stroke="var(--accent-sensor)" stroke-width="1.8"/>
    <text x="1000" y="362" text-anchor="middle" class="box-label" fill="var(--accent-sensor)">온도 센서</text>
    <text x="1000" y="382" text-anchor="middle" class="box-sub">MAX31856 + K타입 열전대</text>
    <text x="1000" y="398" text-anchor="middle" class="box-sub" fill="var(--ink-muted)">실시간 온도 실측</text>

    <!-- Feedback path: sensor -> back to sum -->
    <line x1="910" y1="370" x2="600" y2="370" stroke="#68d391" stroke-width="1.5"/>
    <line x1="600" y1="370" x2="600" y2="157" stroke="#68d391" stroke-width="1.5" marker-end="url(#arrowFeedback)"/>
    <text x="755" y="388" text-anchor="middle" class="flow-label" fill="#2f855a">피드백: 현재온도</text>

    <!-- Fine-tune loop annotation -->
    <rect x="675" y="330" width="180" height="90" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="765" y="356" text-anchor="middle" class="box-sub" font-weight="700" fill="var(--ink-secondary)">30초 주기 반복</text>
    <text x="765" y="376" text-anchor="middle" class="box-sub">e &gt; 0 → 전압 +Δ</text>
    <text x="765" y="394" text-anchor="middle" class="box-sub">e &lt; 0 → 전압 -Δ</text>
    <text x="765" y="412" text-anchor="middle" class="box-sub" fill="var(--ink-muted)">|e| ≤ 허용오차 → 유지</text>
    <line x1="765" y1="330" x2="765" y2="185" stroke="#cbd5e0" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

    <!-- Safety note -->
    <rect x="20" y="470" width="1070" height="60" rx="10" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5"/>
    <text x="40" y="495" class="box-sub" font-weight="700" fill="#c53030">안전장치 (전 구간 최우선)</text>
    <text x="40" y="515" class="box-sub" fill="#742a2a">실측 온도 ≥ 90°C → 즉시 출력 차단(하드 컷오프) · 실측 전류 ≥ 5A → 즉시 차단 · 전압 명령 0~24V 클램핑</text>
  </svg>

  <div class="legend">
    <div class="legend-item"><span class="swatch" style="background:#e2e8f0;border:1.5px solid #a0aec0"></span>Phase1 (개루프, 고정 24V)</div>
    <div class="legend-item"><span class="swatch" style="background:#ebf4ff;border:1.5px solid #2b6cb0"></span>PI 제어기 (연산)</div>
    <div class="legend-item"><span class="swatch" style="background:#fffaf0;border:1.5px solid #c05621"></span>제어 대상 (파워서플라이 + 발열체)</div>
    <div class="legend-item"><span class="swatch" style="background:#f0fff4;border:1.5px solid #2f855a"></span>센서 / 피드백 경로</div>
  </div>
</div>
</body>
</html>
